
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4263eb">
    <title>My First App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4ff;
            text-align: center;
            padding: 40px 20px;
        }

        .card {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            max-width: 350px;
            margin: 40px auto;
            box-shadow: 0 4px 15px #00000015;
        }

        button {
            background: #4263eb;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>My First App ✨</h1>
        <p>Welcome to my very own app!</p>
        <button onclick="alert('Your app is working!')">
            Tap Me
        </button>
    </div>
</body>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js")
      .catch((error) => console.log("Service worker error:", error));
  }
</script>
</html>
